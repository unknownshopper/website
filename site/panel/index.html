<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso al panel — The Unknown Shopper</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    *{box-sizing:border-box;margin:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#0b1e5b;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#1d2340}
    .card{background:#fff;border-radius:16px;padding:36px 32px;width:90%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
    .logo{height:52px;margin-bottom:6px}
    .sub{color:#5b6078;font-size:13px;margin-bottom:24px}
    label{display:block;text-align:left;font-size:12px;color:#5b6078;margin-bottom:6px}
    input{width:100%;border:1px solid #e3e6f0;border-radius:10px;padding:12px 14px;font-size:15px}
    input:focus{outline:2px solid #2563eb;border-color:transparent}
    button{width:100%;margin-top:16px;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:600;background:#2563eb;color:#fff;cursor:pointer}
    button:hover{background:#1d4fd7}
    .foot{margin-top:18px;font-size:12px;color:#9aa0b8}
    .foot a{color:#2563eb;cursor:pointer;text-decoration:none}
    .err{display:none;background:#fdecec;color:#b91c1c;font-size:12px;border-radius:8px;padding:8px;margin-top:12px}
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/tusxx.png" alt="The Unknown Shopper">
    <div class="sub">Panel de administración</div>
    <form id="f">
      <label for="k">Clave de acceso</label>
      <input id="k" type="password" autocomplete="current-password" placeholder="••••••••" autofocus>
      <button type="submit">Entrar al panel</button>
    </form>
    <div class="err" id="err">Clave incorrecta.</div>
    <div class="foot" id="foot">¿Clave equivocada guardada? <a href="?salir">Cerrar sesión</a></div>
  </div>
  <script>
    var EXEC = "https://script.google.com/macros/s/AKfycbw0QxwdJpebcBlXQsuMzuz39LVknuA1Ty8QoQecbwnhPbpsST_ACsosPYbbOZ8Nzjowdw/exec";

    // /panel/?salir → olvida la clave guardada
    if (new URLSearchParams(location.search).has("salir")) {
      localStorage.removeItem("tus_key");
      document.getElementById("foot").innerHTML = "Sesión cerrada.";
    }

    var saved = localStorage.getItem("tus_key");
    if (saved) {
      // clave recordada → directo al panel
      location.replace(EXEC + "?key=" + encodeURIComponent(saved));
    }

    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var k = document.getElementById("k").value.trim();
      if (!k) return;
      localStorage.setItem("tus_key", k);
      location.href = EXEC + "?key=" + encodeURIComponent(k);
    });
  </script>
</body>
</html>
